name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          
      - name: Delete old Android folder
        run: rm -rf android
        
      - name: Regenerate Android project
        run: flutter create . --project-name cbe --platforms android

      # THIS IS THE CORRECTED FIX: Correct block order
      - name: Fix Missing Namespaces (Correct Order)
        run: |
          cat >> android/build.gradle << 'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                      }
                  }
              }
          }

          subprojects {
              project.evaluationDependsOn(':app')
          }
          EOF

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release -PshrinkResources=false
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk
