name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          
      # This deletes the old broken Android folder
      - name: Delete old Android folder
        run: rm -rf android
        
      # This creates a brand new Android folder that works with Flutter 3.22
      - name: Regenerate Android project
        run: flutter create . --project-name cbe --platforms android
        
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk
