name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          
      - name: Delete old Android folder
        run: rm -rf android
        
      - name: Regenerate Android project
        run: flutter create . --project-name cbe --platforms android

      # THIS IS THE FIX: Inject namespace into all sub-projects
      - name: Fix Missing Namespaces
        run: |
          echo "" >> android/build.gradle
          echo "subprojects {" >> android/build.gradle
          echo "    afterEvaluate { project ->" >> android/build.gradle
          echo "        if (project.hasProperty('android')) {" >> android/build.gradle
          echo "            project.android {" >> android/build.gradle
          echo "                if (namespace == null) {" >> android/build.gradle
          echo "                    namespace project.group" >> android/build.gradle
          echo "                }" >> android/build.gradle
          echo "            }" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      
      # Using a Gradle property to disable shrinking safely
      - run: flutter build apk --release -PshrinkResources=false
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk
